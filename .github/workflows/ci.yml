# CI for every pull request and every push to main (ADR-048, WP-6 D1 to D3).
# Pull requests run `pnpm verify` on the affected tasks against the PR's base commit and only
# restore the caches; main runs the full `pnpm verify:all` and is the only run that saves them.
# The integration, web and secrets jobs arrive in later WP-6 steps.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job lists what it needs.
permissions: {}

# One group per pull request: a new push cancels the outdated run. On main every commit has its
# own group and nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: Turborepo diffs against the PR base, check:migrations reads origin/main.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node from .nvmrc and pnpm from packageManager. Its store cache stays off (the default):
      # the steps below restore it on every run and save it on main only.
      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        id: store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Restore the Turborepo cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Save the pnpm store
        if: github.event_name == 'push' && steps.store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The checkout is the merge commit, whose first parent is the base SHA: the diff is the PR.
      - name: Verify the affected tasks
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify

      - name: Verify everything
        if: github.event_name == 'push'
        run: pnpm verify:all

      - name: Save the Turborepo cache
        if: github.event_name == 'push' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
