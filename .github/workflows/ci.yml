# CI for every pull request, every push to main and a weekly backstop (ADR-048, WP-6 D1 to D3, Q3).
# Pull requests run `pnpm verify` on the affected tasks against the PR's base commit and only
# restore the caches; a push to main runs the full `pnpm verify:all` with the cache and is the only
# run that saves the caches. The weekly scheduled run (and a manual run) repeats the full run
# without the Turborepo cache (`TURBO_FORCE`), unit, integration and web, so a test that reads a
# file no task declares fails within a week; when it fails, the last job opens an issue.
# The integration, web, workflows-lint, nginx and backup jobs run next to verify on every event;
# gitleaks and dependency review live in `security.yml`. The zizmor image is pinned by digest, the
# same digest as the root `lint:workflows` script: change both (Renovate updates both in one pull
# request).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:17 UTC (an off-hour minute, away from the top of the hour).
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Nothing by default; each job lists what it needs.
permissions: {}

# One group per pull request: a new push cancels the outdated run. Other events get a group per
# event and commit, so the scheduled run never replaces a pending push run of the same commit;
# nothing on main is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: Turborepo diffs against the PR base, check:migrations reads origin/main.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node from .nvmrc and pnpm from packageManager. Its store cache stays off (the default):
      # the steps below restore it on every run and save it on main only.
      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        id: store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # Not on the backstop runs: they ignore the cache on purpose.
      - name: Restore the Turborepo cache
        id: turbo-cache
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Save the pnpm store
        if: github.event_name == 'push' && steps.store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The checkout is the merge commit, whose first parent is the base SHA: the diff is the PR.
      - name: Verify the affected tasks
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify

      # Push to main: with the cache. Schedule and manual runs: every task runs again (backstop).
      - name: Verify everything
        if: github.event_name != 'pull_request'
        env:
          TURBO_FORCE: ${{ github.event_name != 'push' }}
        run: pnpm verify:all

      # ADR-009 "reported per package in CI": one table of lines and branches per package on the
      # run page. The thresholds already gated inside each `test` task; this only reports, also
      # when verify failed, and writes a short note when no package's tests ran.
      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs

      # Each save on main carries every entry it restored plus this run's, so without pruning the
      # cache only grows. Turborepo writes each entry once and never touches it on a hit, and the
      # cache's tar keeps file times across save and restore, so an entry not written for 7 days
      # (10080 minutes) is dropped; if a task still needs it, it runs once and writes it again.
      - name: Prune the Turborepo cache
        if: github.event_name == 'push' && steps.turbo-cache.outputs.cache-hit != 'true'
        run: |
          if [ -d .turbo/cache ]; then
            echo "Pruning $(find .turbo/cache -type f -mmin +10080 | wc -l) files older than 7 days"
            find .turbo/cache -type f -mmin +10080 -delete
          fi

      - name: Save the Turborepo cache
        if: github.event_name == 'push' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # Integration tests (`*.int.test.ts`) on the runner's Docker through Testcontainers, the same
  # harness as locally (`packages/testing`, ADR-048 change 1, WP-6 D4). Runs in parallel with verify.
  # Ryuk stays on: it removes the containers even when a test run crashes. This job only restores
  # caches: verify's run on main already saves the same pnpm store and Turborepo cache.
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history: Turborepo diffs against the PR base.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # `test:int` itself is never cached (`cache: false`); this replays the `^build` it depends on.
      # Not on the backstop runs: they ignore the cache on purpose.
      - name: Restore the Turborepo cache
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests of the affected packages
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec turbo run test:int --affected

      - name: Integration tests of every package
        if: github.event_name != 'pull_request'
        env:
          TURBO_FORCE: ${{ github.event_name != 'push' }}
        run: pnpm test:int

  # The public site's standalone build and its Playwright smoke, SEO, CSP and axe checks per locale
  # (ADR-048; ADR-009: no coverage percentage for the frontend). Runs in parallel with verify and
  # always reports a result, so it can be a required check (WP-6 D10): on a pull request Turborepo
  # selects `test:e2e` only when `web` or one of its dependencies changed and runs nothing
  # otherwise. Only the enforced CSP runs here; the report-only pass stays a local diagnosis.
  # Playwright uses the runner's preinstalled Google Chrome (`channel: "chrome"`): no browser
  # download. `playwright.config.ts` starts the content API stub and the server and sets SITE_URL
  # itself; the build needs none, because every page, the sitemap and robots render per request.
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history: Turborepo diffs against the PR base.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # `test:e2e` itself is never cached (`cache: false`); this replays the `build` tasks it
      # depends on when an earlier run already produced them. Not on the backstop runs.
      - name: Restore the Turborepo cache
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Web checks when web is affected
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec turbo run test:e2e --affected

      - name: Web checks
        if: github.event_name != 'pull_request'
        env:
          TURBO_FORCE: ${{ github.event_name != 'push' }}
        run: pnpm test:e2e

      # Traces of the failed tests (`trace: "retain-on-failure"`): pages of the public site rendered
      # from the stub's fixture data, no secrets. Open one with `pnpm exec playwright show-trace`.
      - name: Upload the Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The Docker build check of every service image, its smoke runs and its Trivy scan (ADR-049,
  # docs/learning/wp-7.md D9 and D10). One job, so one check name: it always reports, and with no
  # affected service it skips its steps and passes (WP-6 D10; never a `paths:` filter).
  # - Which services: on a pull request, the `image` task of `turbo.json` (inputs: the package, its
  #   dependencies through `^build`, the root `.dockerignore` and `.trivyignore.yaml`; each
  #   Dockerfile is a file of its package) selected by `--affected`; no script runs, the dry run
  #   only names the tasks. Push to main, the weekly and the manual runs build all three.
  # - Build: amd64, loaded into the runner's Docker, never pushed (release.yml pushes). BuildKit's
  #   GitHub cache is read on every run and written only on a push to main (WP-6 D3). That cache
  #   does not carry the pnpm store cache mount, so after a cached `pnpm fetch` layer the install
  #   and `pnpm deploy` download the packages again; accepted, the fetch layer is keyed by the
  #   lockfile.
  # - Smoke: the process is not root; api and agent started with no service configuration stop on
  #   the config error (ADR-043) naming DATABASE_URL, which proves every import resolves; web, which
  #   needs no configuration to start, must reach `healthy` through its own HEALTHCHECK (/robots.txt).
  # - Trivy, run as its container pinned by digest (Renovate updates it), on the image saved with
  #   `docker save`; its database is cached like the other caches. OS packages only, npm findings stay with OSV-Scanner (one tool per job). A
  #   secret in an image always fails. Fixable HIGH and CRITICAL OS findings fail a pull request
  #   that changes what the image is built from (its Dockerfile, which holds the base pin,
  #   `.dockerignore`, `.trivyignore.yaml`); otherwise they are only reported in the job summary.
  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The build summary stays; the per-build record artifact is not needed for a check.
      DOCKER_BUILD_RECORD_UPLOAD: false
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      # Full history: Turborepo and the gate diff against the PR base.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Turborepo is only needed to select the affected services on a pull request.
      - name: Set up pnpm and Node
        if: github.event_name == 'pull_request'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      - name: Locate the pnpm store
        id: pnpm-store
        if: github.event_name == 'pull_request'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile

      - name: Select the affected services
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            services="$(pnpm exec turbo run image --affected --dry=json | jq -c '[.tasks[]
              | select(.task == "image") | .package | ltrimstr("@jadero/")
              | select(IN("agent", "api", "web"))] | sort')"
          else
            services='["agent","api","web"]'
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          if [ "$services" = "[]" ]; then
            echo "No service image is affected: nothing to build." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Affected services: $services"

      - name: Set up Docker Buildx
        if: steps.affected.outputs.services != '[]'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One step per service: an action cannot run in a shell loop. Context `.` is the checkout
      # (the action's default would fetch the repository again through git).
      - name: Build the agent image
        if: contains(fromJSON(steps.affected.outputs.services), 'agent')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: jadero-agent:ci
          cache-from: type=gha,scope=image-agent
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=image-agent' || '' }}

      - name: Build the api image
        if: contains(fromJSON(steps.affected.outputs.services), 'api')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: jadero-api:ci
          cache-from: type=gha,scope=image-api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=image-api' || '' }}

      - name: Build the web image
        if: contains(fromJSON(steps.affected.outputs.services), 'web')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: jadero-web:ci
          cache-from: type=gha,scope=image-web
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=image-web' || '' }}

      # Run hardened as in Compose (read-only, no capabilities, no new privileges). Every service is
      # checked even after one fails, so the log shows them all; the step fails at the end.
      - name: Smoke-test the images
        if: steps.affected.outputs.services != '[]'
        env:
          SERVICES: ${{ steps.affected.outputs.services }}
        run: |
          failed=0
          for service in $(jq -r '.[]' <<<"$SERVICES"); do
            image="jadero-$service:ci"
            uid="$(docker run --rm --entrypoint id "$image" -u)"
            if [ "$uid" = 0 ]; then
              echo "::error::$service: the process runs as root"; failed=1
            else
              echo "$service: runs as uid $uid"
            fi
            if [ "$service" = web ]; then
              container="$(docker run -d --read-only --cap-drop ALL \
                --security-opt no-new-privileges:true --tmpfs /tmp:size=16m \
                --tmpfs /app/apps/web/.next/cache:size=32m,uid=1000,gid=1000,mode=0700 \
                -e SITE_URL=https://ci.invalid "$image")"
              health=starting
              for _ in $(seq 30); do
                health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
                [ "$health" = starting ] || break
                sleep 2
              done
              docker logs "$container"
              docker rm -f "$container" > /dev/null
              if [ "$health" = healthy ]; then
                echo "$service: healthy"
              else
                echo "::error::$service: did not become healthy ($health)"; failed=1
              fi
            else
              # Only OTEL_SERVICE_NAME is set (the exporter defaults to none): without it the
              # instrumentation preload stops on its own config error before dist/main.js loads,
              # which would prove nothing about main's imports. With it, Node links main's whole
              # static import graph before main runs and stops on its config (DATABASE_URL).
              set +e
              output="$(docker run --rm --read-only --cap-drop ALL \
                --security-opt no-new-privileges:true -e OTEL_SERVICE_NAME="$service-smoke" \
                "$image" 2>&1)"
              code=$?
              set -e
              echo "$output"
              if [ "$code" -ne 0 ] && grep -q '^Invalid configuration, refusing to start' <<<"$output" \
                && grep -q 'DATABASE_URL' <<<"$output" && ! grep -q ERR_MODULE_NOT_FOUND <<<"$output"; then
                echo "$service: stops on the config error (exit $code), every import resolved"
              else
                echo "::error::$service: expected the config error naming DATABASE_URL (exit $code)"; failed=1
              fi
            fi
          done
          exit "$failed"

      # Trivy's database, about 80 MB, refreshed upstream every few hours: one cache entry per day,
      # written only on a push to main; any run restores the newest one and Trivy tops it up.
      - name: Date of the Trivy database
        id: trivy-date
        if: steps.affected.outputs.services != '[]'
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the Trivy database
        id: trivy-cache
        if: steps.affected.outputs.services != '[]'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-${{ runner.os }}-

      # Two scans per image: secrets always block; fixable HIGH and CRITICAL OS findings block only
      # in the gate mode described at the top of this job. The findings table goes to the summary.
      - name: Scan the images
        if: steps.affected.outputs.services != '[]'
        env:
          SERVICES: ${{ steps.affected.outputs.services }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cache="$RUNNER_TEMP/trivy-cache"
          report="$RUNNER_TEMP/trivy-report"
          mkdir -p "$cache" "$report"
          # Trivy on the saved image in $tar, as the runner's user so the cache stays writable.
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$tar:/image.tar:ro" -v "$cache:/cache" -v "$report:/report" \
              -v "$GITHUB_WORKSPACE/.trivyignore.yaml:/trivyignore.yaml:ro" \
              "$TRIVY_IMAGE" image --input /image.tar --cache-dir /cache \
              --ignorefile /trivyignore.yaml --skip-version-check --disable-telemetry --quiet "$@"
          }
          failed=0
          for service in $(jq -r '.[]' <<<"$SERVICES"); do
            tar="$RUNNER_TEMP/$service.tar"
            docker save "jadero-$service:ci" -o "$tar"
            # The secret table has a row per scanned file (about 1,300 lines with nothing found),
            # so it goes to a file and is printed only when the scan fails.
            if ! trivy --scanners secret --exit-code 1 --format table \
              --output "/report/$service-secrets.txt"; then
              if [ -s "$report/$service-secrets.txt" ]; then cat "$report/$service-secrets.txt"; fi
              echo "::error::$service: Trivy found a secret in the image"; failed=1
            fi
            gate=0
            if [ "$EVENT_NAME" = pull_request ] && [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- \
              "apps/$service/Dockerfile" .dockerignore .trivyignore.yaml)" ]; then
              gate=1
            fi
            if [ "$gate" = 1 ]; then
              mode="blocking: this pull request changes what the image is built from"
            else
              mode="report only"
            fi
            set +e
            table="$(trivy --scanners vuln --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code "$gate" --format table)"
            code=$?
            set -e
            echo "$table"
            {
              echo "### $service: fixable HIGH and CRITICAL OS findings ($mode)"
              echo
              echo '```'
              echo "${table:-none}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then
              echo "::error::$service: fixable HIGH or CRITICAL OS findings (exit $code)"; failed=1
            fi
            rm -f "$tar"
          done
          exit "$failed"

      - name: Save the Trivy database
        if: >-
          always() && github.event_name == 'push' && steps.affected.outputs.services != '[]'
          && steps.trivy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}

  # zizmor over the workflows themselves (WP-6, implementation choice "Workflow lint"): template
  # injection, unpinned or excessive permissions, credentials left in checkouts, dangerous
  # triggers. Offline mode, so no token and no network; plain output, no SARIF upload. Runs on
  # every event, not only when a workflow changed, so it can be a required check (D10).
  # Same command locally: `pnpm lint:workflows`.
  workflows-lint:
    name: workflows-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          --offline --format plain .github/workflows/

  # The nginx edge (WP-8 step 5; ADR-047's edge part, ADR-050): the repo's nginx.conf, snippets and
  # sites installed into Ubuntu 26.04 with the distro nginx (the server's release, nginx 1.28.3),
  # throwaway self-signed certificates at certbot's paths, `nginx -t`, then nginx started and
  # infra/scripts/smoke-edge.sh run against it (headers, no version, no CORS, internal paths 404,
  # TLS 1.1 refused; the upstreams are absent and answer 502). On a pull request the check runs
  # only when the PR changes infra/nginx/, the two scripts or this file; otherwise the job passes
  # with nothing run (a step-level skip, never a `paths:` filter, so it can become a required
  # check). Same command locally: `pnpm nginx:check`. The image is pinned by digest, the same
  # digest as that root script: change both (Renovate updates both in one pull request).
  nginx:
    name: nginx
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NGINX_TEST_IMAGE: docker.io/library/ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    steps:
      # Full history: the change check diffs against the PR base.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the run
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT_NAME" = pull_request ] && git diff --quiet "$BASE_SHA" HEAD -- \
            infra/nginx infra/scripts/nginx-check.sh infra/scripts/smoke-edge.sh .github/workflows/ci.yml; then
            run=false
            echo "Nothing the nginx edge reads changed: no nginx check." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Check and smoke-test the nginx edge
        if: steps.changed.outputs.run == 'true'
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE/infra:/infra:ro" "$NGINX_TEST_IMAGE"
          bash /infra/scripts/nginx-check.sh --smoke

  # The server's backup and restore scripts (WP-8 step 6, D7; ADR-051 restating ADR-050 "Backup
  # destination"): infra/scripts/backup-check.sh runs backup.sh and restore.sh against throwaway
  # Postgres, RabbitMQ and Uptime Kuma containers (the images of compose.ops.yml) and a local
  # restic repository, on the runner's Docker: every database found and saved, a failing dump
  # saves no snapshot and sends no heartbeat, Kuma started again, the last complete night restored
  # into a container with no network with matching row counts, no secret in the output. On a pull
  # request it runs only when the PR changes what those scripts read; otherwise the job passes with
  # nothing run (a step-level skip, as in the nginx job). Same command locally: `pnpm backup:check`.
  # The restic and docker CLI images are pinned by digest in the script.
  backup:
    name: backup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: the change check diffs against the PR base.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the run
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT_NAME" = pull_request ] && git diff --quiet "$BASE_SHA" HEAD -- \
            infra/scripts/backup.sh infra/scripts/restore.sh infra/scripts/backup-check.sh \
            infra/env/backup.env.tpl infra/compose/compose.ops.yml infra/postgres/pg_hba.conf \
            .github/workflows/ci.yml; then
            run=false
            echo "Nothing the backup scripts read changed: no backup check." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Back up, fail and restore against throwaway containers
        if: steps.changed.outputs.run == 'true'
        run: bash infra/scripts/backup-check.sh

  # The backstop's alarm (WP-6 Q3): when the weekly uncached run fails, open an issue, or comment
  # on the one still open, so a red scheduled run is not missed. The only job with a write token,
  # and it runs no repository code. Deduplicated by the fixed title; the run URL reaches the shell
  # as an environment variable. A manual run that fails shows only on the run page.
  backstop-issue:
    name: backstop-issue
    if: failure() && github.event_name == 'schedule'
    needs: [verify, integration, web, nginx, backup]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open the backstop issue, or comment on the open one
    steps:
      - name: Open or update the backstop issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Weekly uncached CI run failed"
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg title "$TITLE" 'map(select(.title == $title)) | first | .number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "It failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$(printf '%s\n\n%s\n' \
              "The weekly run of ci.yml without the Turborepo cache failed: $RUN_URL" \
              "A task that passes on pull requests failed when run from scratch. Look for a file a test reads that its task's inputs do not declare (WP-6 D2), or a flaky test. Close this issue when main is green again.")"
          fi
