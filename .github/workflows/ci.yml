# CI for every pull request and every push to main (ADR-048, WP-6 D1 to D3).
# Pull requests run `pnpm verify` on the affected tasks against the PR's base commit and only
# restore the caches; main runs the full `pnpm verify:all` and is the only run that saves them.
# The integration, web, secrets and workflows-lint jobs run next to verify on every event, and
# dependency-review on pull requests. The tools run as containers (gitleaks, zizmor) are pinned by
# digest, the same digests as the root `scan:secrets` and `lint:workflows` scripts: change both.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job lists what it needs.
permissions: {}

# One group per pull request: a new push cancels the outdated run. On main every commit has its
# own group and nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: Turborepo diffs against the PR base, check:migrations reads origin/main.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node from .nvmrc and pnpm from packageManager. Its store cache stays off (the default):
      # the steps below restore it on every run and save it on main only.
      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        id: store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Restore the Turborepo cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Save the pnpm store
        if: github.event_name == 'push' && steps.store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The checkout is the merge commit, whose first parent is the base SHA: the diff is the PR.
      - name: Verify the affected tasks
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify

      - name: Verify everything
        if: github.event_name == 'push'
        run: pnpm verify:all

      # ADR-009 "reported per package in CI": one table of lines and branches per package on the
      # run page. The thresholds already gated inside each `test` task; this only reports, also
      # when verify failed, and writes a short note when no package's tests ran.
      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs

      # Each save on main carries every entry it restored plus this run's, so without pruning the
      # cache only grows. Turborepo writes each entry once and never touches it on a hit, and the
      # cache's tar keeps file times across save and restore, so an entry not written for 7 days
      # (10080 minutes) is dropped; if a task still needs it, it runs once and writes it again.
      - name: Prune the Turborepo cache
        if: github.event_name == 'push' && steps.turbo-cache.outputs.cache-hit != 'true'
        run: |
          if [ -d .turbo/cache ]; then
            echo "Pruning $(find .turbo/cache -type f -mmin +10080 | wc -l) files older than 7 days"
            find .turbo/cache -type f -mmin +10080 -delete
          fi

      - name: Save the Turborepo cache
        if: github.event_name == 'push' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # Integration tests (`*.int.test.ts`) on the runner's Docker through Testcontainers, the same
  # harness as locally (`packages/testing`, ADR-048 change 1, WP-6 D4). Runs in parallel with verify.
  # Ryuk stays on: it removes the containers even when a test run crashes. This job only restores
  # caches: verify's run on main already saves the same pnpm store and Turborepo cache.
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history: Turborepo diffs against the PR base.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # `test:int` itself is never cached (`cache: false`); this replays the `^build` it depends on.
      - name: Restore the Turborepo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests of the affected packages
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec turbo run test:int --affected

      - name: Integration tests of every package
        if: github.event_name == 'push'
        run: pnpm test:int

  # The public site's standalone build and its Playwright smoke, SEO, CSP and axe checks per locale
  # (ADR-048; ADR-009: no coverage percentage for the frontend). Runs in parallel with verify and
  # always reports a result, so it can be a required check (WP-6 D10): on a pull request Turborepo
  # selects `test:e2e` only when `web` or one of its dependencies changed and runs nothing
  # otherwise. Only the enforced CSP runs here; the report-only pass stays a local diagnosis.
  # Playwright uses the runner's preinstalled Google Chrome (`channel: "chrome"`): no browser
  # download. `playwright.config.ts` starts the content API stub and the server and sets SITE_URL
  # itself; the build needs none, because every page, the sitemap and robots render per request.
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history: Turborepo diffs against the PR base.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # `test:e2e` itself is never cached (`cache: false`); this replays the `build` tasks it
      # depends on when an earlier run already produced them.
      - name: Restore the Turborepo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Web checks when web is affected
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec turbo run test:e2e --affected

      - name: Web checks
        if: github.event_name == 'push'
        run: pnpm test:e2e

      # Traces of the failed tests (`trace: "retain-on-failure"`): pages of the public site rendered
      # from the stub's fixture data, no secrets. Open one with `pnpm exec playwright show-trace`.
      - name: Upload the Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # gitleaks over every commit of the pull request, so a key added and removed inside the PR is
  # still caught, and over the whole history (every ref) on main (ADR-026, WP-6 D7). Findings are
  # redacted in the log; reviewed false positives live in `.gitleaksignore` by fingerprint. A real
  # finding means rotate the key first, rewrite history second. Same command locally:
  # `pnpm scan:secrets`.
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: the PR range and the full scan both read old commits.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The PR's own commits, base (exclusive) to head; the merge commit is not scanned, it only
      # joins them. The SHAs reach the shell as environment variables.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --verbose --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Scan the full history
        if: github.event_name == 'push'
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --verbose --no-banner

  # zizmor over the workflows themselves (WP-6, implementation choice "Workflow lint"): template
  # injection, unpinned or excessive permissions, credentials left in checkouts, dangerous
  # triggers. Offline mode, so no token and no network; plain output, no SARIF upload. Runs on
  # every event, not only when a workflow changed, so it can be a required check (D10).
  # Same command locally: `pnpm lint:workflows`.
  workflows-lint:
    name: workflows-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/zizmorcore/zizmor@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          --offline --format plain .github/workflows/

  # Licenses of the dependencies a pull request adds or changes, from GitHub's dependency graph
  # (WP-6 Q1 answer A). The vulnerability check is off: OSV-Scanner gates vulnerabilities (Q2), so
  # one advisory does not fail two checks. AGPL and GPL are denied for a network service that is
  # deployed; LGPL (sharp's libvips) and the permissive licenses pass. The action diffs base and
  # head through the API, so it needs no checkout. It only means something on a pull request; on
  # main the job is skipped, which GitHub reports as success.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          license-check: true
          vulnerability-check: false
          deny-licenses: >-
            AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later
