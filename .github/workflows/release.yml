# Per-service releases (ADR-049, which supersedes ADR-025 and ADR-048; WP-7 D6 to D8, D10, D11).
# On every push to main, release-please opens or updates the one combined Release PR from the
# conventional commits, attributed to components by path (release-please-config.json). Merging
# that PR tags each released component `<component>-v<version>`; for each released service the
# images job builds the image once from the commit the tag points at, smoke-tests it hardened,
# scans it with Trivy, pushes it to GHCR as `:<version>` and `:sha-<short>` with a BuildKit SBOM,
# and signs a SLSA build provenance for its digest (keyless: the job's OIDC token, a Sigstore
# certificate valid for minutes).
# A manual run is the dry run: it builds, smoke-tests and scans one service, and never logs in,
# pushes or attests. Images stay private (ADR-049, registry B): the first push creates each
# package private and nothing here changes that.
# Then the deploy (WP-9 D8, ADR-049 restating ADR-048's pipeline): deploy-staging runs deploy.yml
# for each released service, in the order agent, api, web (consumers before producers, the HTTP
# provider before web), one at a time, a failure stopping the later ones; deploy-production runs
# the same services with the same versions and digests once every staging deploy succeeded and the
# owner approved the production environment. If any images leg fails, nothing deploys. A manual
# dry run never deploys.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to build and scan without pushing (dry run)
        required: true
        type: choice
        options: [api, agent, web]

# Nothing by default; each job lists what it needs.
permissions: {}

# Concurrency is set per job, not for the whole run (WP-9, owner decision of 2026-10-24): a
# workflow-level group would stay held while deploy-production waits for its approval, and every
# later release (Release PR update, tags, images, staging) would wait behind it.
# - release-please: one at a time per branch, never cancelled in progress. A newer pending job
#   replaces an older pending one, which is safe: release-please reads every commit and every
#   merged Release PR still marked pending, so the newer run tags what the replaced one would have.
# - images: no group. Each leg builds and pushes the version its tag names, so legs of two runs
#   never touch the same tag and can run side by side; nothing ever cancels one, so no tag is left
#   without its image (a group would let a newer pending leg replace an older one). A manual dry
#   run pushes nothing.
# - deploys: deploy.yml's group `deploy-<environment>-<service>` (see there).

jobs:
  # The job's GITHUB_TOKEN opens the Release PR (D11; needs the repository setting "Allow GitHub
  # Actions to create and approve pull requests"). Its pull requests and tags start no workflow,
  # so the images job lives in this workflow, after this job.
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release-please
      cancel-in-progress: false
    permissions:
      contents: write # release branch, tags and GitHub releases
      pull-requests: write # open and update the Release PR
      issues: write # the autorelease labels
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      services: ${{ steps.services.outputs.services }}
      shas: ${{ steps.services.outputs.shas }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # Shared packages release too (node-workspace plugin), but only apps ship an image. Each
      # service also gets the commit its tag points at (release-please's `<path>--sha` output):
      # the merged Release PR, which is not GITHUB_SHA when this run replaced an older pending one.
      - name: Select the released services
        id: services
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          AGENT_SHA: ${{ steps.release.outputs['apps/agent--sha'] }}
          API_SHA: ${{ steps.release.outputs['apps/api--sha'] }}
          WEB_SHA: ${{ steps.release.outputs['apps/web--sha'] }}
        run: |
          # In deploy order (WP-9 D6): agent consumes what api produces, web reads api's HTTP.
          services="$(jq -c '. as $released | ["agent", "api", "web"]
            | map(select(. as $s | $released | index("apps/" + $s)))' <<<"${PATHS_RELEASED:-[]}")"
          shas="$(jq -nc --arg agent "$AGENT_SHA" --arg api "$API_SHA" --arg web "$WEB_SHA" \
            '{agent: $agent, api: $api, web: $web} | with_entries(select(.value != ""))')"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "shas=$shas" >> "$GITHUB_OUTPUT"
          echo "Released services: $services, tagged commits: $shas"

  images:
    name: images (${{ matrix.service }})
    needs: release-please
    # On a manual run release-please is skipped; !cancelled() lets this job run anyway.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (needs.release-please.result == 'success' && needs.release-please.outputs.services != '[]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR with the job's token (ADR-043)
      id-token: write # the OIDC token Sigstore turns into a signing certificate
      attestations: write # store the provenance
      artifact-metadata: write # the artifact storage record of the attestation
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.service) || needs.release-please.outputs.services) }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      IMAGE_PREFIX: ghcr.io/josealbdr/jadero-dev
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      # A release builds the commit release-please tagged for this service, so the image holds
      # exactly the code of its version even when a newer push reached main before this run. A
      # manual dry run has no tag and builds the commit it was started on.
      - name: Pick the commit
        id: commit
        env:
          SERVICE: ${{ matrix.service }}
          SHAS: ${{ needs.release-please.outputs.shas }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            sha="$(jq -r --arg service "$SERVICE" '.[$service] // empty' <<<"$SHAS")"
          else
            sha="$GITHUB_SHA"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$SERVICE: no tagged commit to build ('$sha')"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$SERVICE: building $sha"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      # The version comes from the service's package.json, which the merged Release PR set to the
      # version just tagged. On a manual run it is the current version, for the labels only.
      - name: Name the image
        id: meta
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          case "$SERVICE" in agent|api|web) ;; *) echo "::error::unknown service"; exit 1 ;; esac
          version="$(jq -r .version "apps/$SERVICE/package.json")"
          image="$IMAGE_PREFIX-$SERVICE"
          {
            echo "version=$version"
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:sha-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$image:$version and :sha-${SHA::7}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once into the runner's Docker for the smoke run and the scan. The push below runs the
      # same build again on this builder: every layer comes from its local cache, so the pushed
      # image holds the bytes that were tested and scanned. Reads main's build cache, never writes.
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: jadero-${{ matrix.service }}:release
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.service }}

      # The same smoke run as the images job of ci.yml: hardened as in Compose, never root; the
      # Nest services stop on their config error with every import resolved, web becomes healthy.
      - name: Smoke-test the image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image="jadero-$SERVICE:release"
          uid="$(docker run --rm --entrypoint id "$image" -u)"
          if [ "$uid" = 0 ]; then echo "::error::$SERVICE: the process runs as root"; exit 1; fi
          echo "$SERVICE: runs as uid $uid"
          if [ "$SERVICE" = web ]; then
            container="$(docker run -d --read-only --cap-drop ALL \
              --security-opt no-new-privileges:true --tmpfs /tmp:size=16m \
              --tmpfs /app/apps/web/.next/cache:size=32m,uid=1000,gid=1000,mode=0700 \
              -e SITE_URL=https://ci.invalid "$image")"
            health=starting
            for _ in $(seq 30); do
              health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              [ "$health" = starting ] || break
              sleep 2
            done
            docker logs "$container"
            docker rm -f "$container" > /dev/null
            if [ "$health" != healthy ]; then
              echo "::error::$SERVICE: did not become healthy ($health)"; exit 1
            fi
            echo "$SERVICE: healthy"
          else
            set +e
            output="$(docker run --rm --read-only --cap-drop ALL \
              --security-opt no-new-privileges:true -e OTEL_SERVICE_NAME="$SERVICE-smoke" \
              "$image" 2>&1)"
            code=$?
            set -e
            echo "$output"
            if [ "$code" -ne 0 ] && grep -q '^Invalid configuration, refusing to start' <<<"$output" \
              && grep -q 'DATABASE_URL' <<<"$output" && ! grep -q ERR_MODULE_NOT_FOUND <<<"$output"; then
              echo "$SERVICE: stops on the config error (exit $code), every import resolved"
            else
              echo "::error::$SERVICE: expected the config error naming DATABASE_URL (exit $code)"; exit 1
            fi
          fi

      # The database cache that ci.yml saves on main; restored only, never written here.
      - name: Restore the Trivy database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-${{ runner.os }}-release
          restore-keys: trivy-${{ runner.os }}-

      # D10: a secret in the image always fails. OS findings are reported, never blocking: a
      # release may be the one that carries the fix; the weekly scan is the second channel.
      - name: Scan the image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          cache="$RUNNER_TEMP/trivy-cache"
          report="$RUNNER_TEMP/trivy-report"
          tar="$RUNNER_TEMP/$SERVICE.tar"
          mkdir -p "$cache" "$report"
          docker save "jadero-$SERVICE:release" -o "$tar"
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$tar:/image.tar:ro" -v "$cache:/cache" -v "$report:/report" \
              -v "$GITHUB_WORKSPACE/.trivyignore.yaml:/trivyignore.yaml:ro" \
              "$TRIVY_IMAGE" image --input /image.tar --cache-dir /cache \
              --ignorefile /trivyignore.yaml --skip-version-check --disable-telemetry --quiet "$@"
          }
          # The secret table has a row per scanned file, so it is printed only on a finding.
          if ! trivy --scanners secret --exit-code 1 --format table --output /report/secrets.txt; then
            if [ -s "$report/secrets.txt" ]; then cat "$report/secrets.txt"; fi
            echo "::error::$SERVICE: Trivy found a secret in the image"; exit 1
          fi
          table="$(trivy --scanners vuln --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 --format table)"
          echo "$table"
          {
            echo "### $SERVICE: fixable HIGH and CRITICAL OS findings (report only)"
            echo
            echo '```'
            echo "${table:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$tar"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit attaches the SBOM to the pushed image. Its own unsigned provenance stays off: the
      # signed one comes from the attest step below.
      - name: Push the image
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.service }}

      # The pushed image must be the one smoke-tested and scanned, before it is signed: same config
      # digest. The scanned one is BuildKit's containerimage.config.digest from the loaded build's
      # metadata, not the local image ID: under Docker's containerd image store (Docker 29) the ID
      # is the manifest or index digest. With the SBOM the push is an index holding one linux/amd64
      # image manifest and one attestation manifest; the image manifest names the config.
      - name: Check the pushed image is the scanned one
        if: github.event_name == 'push'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          manifest="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" \
            | jq -r --arg digest "$DIGEST" 'if has("manifests") then
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
                | if length == 1 then .[0].digest else error("not one linux/amd64 manifest") end
              else $digest end')"
          pushed="$(docker buildx imagetools inspect --raw "$IMAGE@$manifest" | jq -r .config.digest)"
          scanned="$(jq -r '."containerimage.config.digest" // empty' <<<"$BUILD_METADATA")"
          if [ -z "$scanned" ]; then
            echo "::error::$SERVICE: the build metadata has no config digest for the scanned image"
            exit 1
          fi
          if [ "$pushed" != "$scanned" ]; then
            echo "::error::$SERVICE: the pushed image ($pushed) is not the scanned one ($scanned)"
            exit 1
          fi
          echo "$SERVICE: the pushed image is the scanned one ($pushed)"

      # Verify from anywhere: gh attestation verify oci://<image>:<version> --owner JoseAlbDR
      - name: Attest the build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The deploy jobs need each leg's version and pushed digest. Outputs of a matrix job overwrite
      # each other across legs, so each leg uploads its own artifact (`image-<service>`) and the
      # digests job joins them. The digest is the pushed index, the one attested above and the one
      # the server reads from RepoDigests after its pull by tag.
      - name: Record the version and digest
        if: github.event_name == 'push'
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$SERVICE: the push gave no digest"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/image"
          jq -nc --arg version "$VERSION" --arg digest "$DIGEST" '{version: $version, digest: $digest}' \
            > "$RUNNER_TEMP/image/$SERVICE.json"
          echo "$SERVICE: $VERSION is $DIGEST"

      - name: Upload the version and digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 7

  # Joins the legs' artifacts into one output for both deploy jobs: {"api": {"version": "0.3.0",
  # "digest": "sha256:..."}}. Runs only when every images leg succeeded, so a failed leg deploys
  # nothing, not even the services whose images were pushed.
  digests:
    name: digests
    needs: [release-please, images]
    if: github.event_name == 'push' && needs.release-please.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      images: ${{ steps.join.outputs.images }}
    steps:
      - name: Download the versions and digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Join them
        id: join
        env:
          SERVICES: ${{ needs.release-please.outputs.services }}
        run: |
          images='{}'
          for service in $(jq -r '.[]' <<<"$SERVICES"); do
            case "$service" in agent|api|web) ;; *) echo "::error::unknown service"; exit 1 ;; esac
            file="$RUNNER_TEMP/images/$service.json"
            if [ ! -f "$file" ]; then echo "::error::$service: no recorded digest"; exit 1; fi
            version="$(jq -r .version "$file")"
            digest="$(jq -r .digest "$file")"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$service: bad version or digest in the artifact"; exit 1
            fi
            images="$(jq -c --arg s "$service" --arg v "$version" --arg d "$digest" \
              '.[$s] = {version: $v, digest: $d}' <<<"$images")"
          done
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "To deploy: $images"

  # Staging deploys by itself (D8). max-parallel 1 runs the legs one at a time in the matrix order
  # (agent, api, web); fail-fast cancels the legs not started yet when one fails, so a producer
  # never ships after its consumer failed. deploy.yml serializes per environment and service
  # (each leg's group takes its own service from `with`) and validates every input again.
  deploy-staging:
    name: deploy-staging (${{ matrix.service }})
    needs: [release-please, digests]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read # the job's token, handed to the server for one pull
      id-token: write # Tailscale workload identity federation
      attestations: read # used by a manual deploy only; a called job gets at most the caller's
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.release-please.outputs.services) }}
    # zizmor's self-repository rule is ignored on purpose: for a reusable workflow call GitHub
    # resolves `./` at the caller's commit, not from the runner's filesystem (a `uses:` job has no
    # steps or checkout), so `$/` adds nothing here, and actionlint 1.7.12 still rejects `$/`.
    uses: ./.github/workflows/deploy.yml # zizmor: ignore[self-repository]
    with:
      environment: staging
      service: ${{ matrix.service }}
      version: ${{ fromJSON(needs.digests.outputs.images)[matrix.service].version }}
      digest: ${{ fromJSON(needs.digests.outputs.images)[matrix.service].digest }}

  # Production waits for the owner's approval on the production environment, and runs only when
  # every staging leg succeeded: the same services, versions and digests, so production runs the
  # bytes staging tested (promotion by digest). The server refuses another digest.
  deploy-production:
    name: deploy-production (${{ matrix.service }})
    needs: [release-please, digests, deploy-staging]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.release-please.outputs.services) }}
    # zizmor's self-repository rule is ignored on purpose: for a reusable workflow call GitHub
    # resolves `./` at the caller's commit, not from the runner's filesystem (a `uses:` job has no
    # steps or checkout), so `$/` adds nothing here, and actionlint 1.7.12 still rejects `$/`.
    uses: ./.github/workflows/deploy.yml # zizmor: ignore[self-repository]
    with:
      environment: production
      service: ${{ matrix.service }}
      version: ${{ fromJSON(needs.digests.outputs.images)[matrix.service].version }}
      digest: ${{ fromJSON(needs.digests.outputs.images)[matrix.service].digest }}
