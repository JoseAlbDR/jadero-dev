# Security checks on every pull request, every push to main and weekly (ADR-048 "Workflows",
# WP-6 D7, D10, Q1 and Q2). No `paths:` filter on purpose: these jobs are required checks, and a
# required check whose workflow a path filter skips stays "Pending" and blocks the merge. A job
# that only means something on some events is skipped by a job-level `if:`, which GitHub reports
# as success. The gitleaks image is pinned by digest, the same digest as the root `scan:secrets`
# script: change both (Renovate updates both in one pull request).
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:41 UTC (an off-hour minute, away from the top of the hour).
    - cron: "41 5 * * 1"
  workflow_dispatch:

# Nothing by default; each job lists what it needs.
permissions: {}

# One group per pull request: a new push cancels the outdated run. Other events get a group per
# event and commit, so a scheduled run never replaces a pending push run; nothing on main is
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The vulnerability gate (WP-6 Q2 answer A): OSV-Scanner's reusable pull request workflow scans
  # the lockfiles at the base branch and at the PR's merge commit, and fails only on
  # vulnerabilities the PR introduces, so an advisory published for a dependency nobody touched
  # never blocks an unrelated PR (diff-based gate). It fails, rather than passing, when either scan
  # does not complete. The permissions are the most the called job may use: `actions: read` and
  # `security-events: write` upload the SARIF result to the Security tab.
  # On a PR from a fork GitHub gives the token read access only, so the upload would fail the job;
  # there the upload is skipped and the gate still fails on a new vulnerability.
  # The called job keeps its own checkout credentials (it needs them to switch to the base branch);
  # it only reads lockfiles and runs no code from the PR.
  osv-scanner:
    name: osv-scanner
    if: github.event_name == 'pull_request'
    permissions:
      actions: read # read the workflow run the SARIF upload belongs to
      contents: read # check out the repository and read its lockfiles
      security-events: write # upload the SARIF result to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-24.04
      upload-sarif: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  # The full scan of every lockfile against today's advisories, on main and weekly (full-state
  # report). It reports to the Security tab and does not fail on a finding: the alert there, and
  # the matching Dependabot alert Renovate reads for a fix PR, are the signal. It still fails when
  # the scan itself does not complete.
  osv-scanner-full:
    name: osv-scanner-full
    if: github.event_name != 'pull_request'
    permissions:
      actions: read # read the workflow run the SARIF upload belongs to
      contents: read # check out the repository and read its lockfiles
      security-events: write # upload the SARIF result to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-24.04
      fail-on-vuln: false

  # Licenses of the dependencies a pull request adds or changes, from GitHub's dependency graph
  # (WP-6 Q1 answer A). The vulnerability check is off: OSV-Scanner gates vulnerabilities (Q2), so
  # one advisory does not fail two checks. AGPL and GPL are denied for a network service that is
  # deployed; LGPL (sharp's libvips) and the permissive licenses pass. The action diffs base and
  # head through the API, so it needs no checkout. It only means something on a pull request; on
  # other events the job is skipped, which GitHub reports as success.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          license-check: true
          vulnerability-check: false
          deny-licenses: >-
            AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later

  # gitleaks over every commit of the pull request, so a key added and removed inside the PR is
  # still caught, and over the whole history (every ref) on main, weekly and on a manual run
  # (ADR-048, WP-6 D7). Findings are redacted in the log; reviewed false positives live in
  # `.gitleaksignore` by fingerprint. A real finding means rotate the key first, rewrite history
  # second. Same command locally: `pnpm scan:secrets`.
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: the PR range and the full scan both read old commits.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The PR's own commits, base (exclusive) to head; the merge commit is not scanned, it only
      # joins them. The SHAs reach the shell as environment variables.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --verbose --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --verbose --no-banner

  # The second channel of the image scans (WP-7 D10): the pull request gate and the release scan
  # only see an image when it is built, so an advisory published later for a package inside a
  # released image would reach nobody. Weekly (and on a manual run) this reads the released
  # versions from `.release-please-manifest.json` and lists every app that ships an image (has a
  # Dockerfile) and has released at least once. With none released the list is empty and the scan
  # job is skipped, which GitHub reports as success.
  released-images:
    name: released-images
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the released images
        id: released
        run: |
          candidates="$(jq -c '[to_entries[]
            | select((.key | test("^apps/[a-z][a-z0-9-]*$")) and .value != "0.0.0")
            | {service: (.key | ltrimstr("apps/")), version: .value}] | sort_by(.service)' \
            .release-please-manifest.json)"
          released="$(jq -c '[.[] | select(.service | IN($images[]))]' \
            --argjson images "$(find apps -mindepth 2 -maxdepth 2 -name Dockerfile \
              | cut -d/ -f2 | jq -R . | jq -cs .)" <<<"$candidates")"
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "Released images: $released"

  # Pulls each released image from GHCR (private, ADR-049) and scans it twice with Trivy, by the
  # same pinned digest as ci.yml and release.yml. Pass 1: every vulnerability, OS and npm, all
  # severities, uploaded as SARIF to the Security tab (one category per service). Pass 2: fixable
  # CRITICAL only; when it finds any, the job opens an issue for the service, or comments on the
  # one still open (deduplicated by its exact title). Neither pass fails the job: the Security tab
  # and the issue are the signal. A pull that fails does: the manifest names a version whose image
  # was never pushed. The issue body holds only advisory ids, packages, versions and the image tag.
  image-scan:
    name: image-scan (${{ matrix.service }})
    needs: released-images
    if: needs.released-images.outputs.released != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out .trivyignore.yaml
      packages: read # pull the private image from GHCR
      security-events: write # upload the SARIF result to the Security tab
      issues: write # open the scan issue, or comment on the open one
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.released-images.outputs.released) }}
    env:
      IMAGE_PREFIX: ghcr.io/josealbdr/jadero-dev
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ matrix.version }}
        run: |
          if ! [[ "$SERVICE" =~ ^[a-z][a-z0-9-]*$ && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected service or version in the manifest"; exit 1
          fi
          image="$IMAGE_PREFIX-$SERVICE:$VERSION"
          docker pull --quiet "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The database cache that ci.yml saves on main; restored only, never written here.
      - name: Restore the Trivy database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-${{ runner.os }}-weekly
          restore-keys: trivy-${{ runner.os }}-

      - name: Scan the image
        id: scan
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          cache="$RUNNER_TEMP/trivy-cache"
          report="$RUNNER_TEMP/trivy-report"
          tar="$RUNNER_TEMP/$SERVICE.tar"
          mkdir -p "$cache" "$report"
          docker save "$IMAGE" -o "$tar"
          # Trivy on the saved image, as the runner's user so the cache and reports stay writable.
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$tar:/image.tar:ro" -v "$cache:/cache" -v "$report:/report" \
              -v "$GITHUB_WORKSPACE/.trivyignore.yaml:/trivyignore.yaml:ro" \
              "$TRIVY_IMAGE" image --input /image.tar --cache-dir /cache \
              --ignorefile /trivyignore.yaml --skip-version-check --disable-telemetry --quiet "$@"
          }
          trivy --scanners vuln --pkg-types os,library --exit-code 0 \
            --format sarif --output /report/trivy.sarif
          trivy --scanners vuln --pkg-types os,library --severity CRITICAL --ignore-unfixed \
            --exit-code 0 --format json --output /report/critical.json
          rm -f "$tar"
          count="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$report/critical.json")"
          jq -r --arg image "$IMAGE" '"Image: `\($image)`", "",
            ([.Results[]?.Vulnerabilities[]?
              | "- \(.VulnerabilityID): \(.PkgName) \(.InstalledVersion), fixed in \(.FixedVersion)"]
              | unique[])' "$report/critical.json" > "$report/issue.md"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$SERVICE: $count fixable CRITICAL findings"

      - name: Upload the result to the Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/trivy-report/trivy.sarif
          category: trivy-image-${{ matrix.service }}

      # One issue per service, found by its exact title among the open ones: a new finding
      # comments on it, so a weekly finding nobody has fixed yet does not open a new issue.
      - name: Open or update the scan issue
        if: steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Weekly image scan: fixable CRITICAL in ${{ matrix.service }}"
        run: |
          body="$RUNNER_TEMP/trivy-report/issue.md"
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --limit 100 \
            --json number,title \
            | jq -r --arg title "$TITLE" 'map(select(.title == $title)) | first | .number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
