# Security checks on every pull request, every push to main and weekly (ADR-048 "Workflows",
# WP-6 D7, D10, Q1 and Q2). No `paths:` filter on purpose: these jobs are required checks, and a
# required check whose workflow a path filter skips stays "Pending" and blocks the merge. A job
# that only means something on some events is skipped by a job-level `if:`, which GitHub reports
# as success. The gitleaks image is pinned by digest, the same digest as the root `scan:secrets`
# script: change both (Renovate updates both in one pull request).
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:41 UTC (an off-hour minute, away from the top of the hour).
    - cron: "41 5 * * 1"
  workflow_dispatch:

# Nothing by default; each job lists what it needs.
permissions: {}

# One group per pull request: a new push cancels the outdated run. Other events get a group per
# event and commit, so a scheduled run never replaces a pending push run; nothing on main is
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The vulnerability gate (WP-6 Q2 answer A): OSV-Scanner's reusable pull request workflow scans
  # the lockfiles at the base branch and at the PR's merge commit, and fails only on
  # vulnerabilities the PR introduces, so an advisory published for a dependency nobody touched
  # never blocks an unrelated PR (diff-based gate). It fails, rather than passing, when either scan
  # does not complete. The permissions are the most the called job may use: `actions: read` and
  # `security-events: write` upload the SARIF result to the Security tab.
  # On a PR from a fork GitHub gives the token read access only, so the upload would fail the job;
  # there the upload is skipped and the gate still fails on a new vulnerability.
  # The called job keeps its own checkout credentials (it needs them to switch to the base branch);
  # it only reads lockfiles and runs no code from the PR.
  osv-scanner:
    name: osv-scanner
    if: github.event_name == 'pull_request'
    permissions:
      actions: read # read the workflow run the SARIF upload belongs to
      contents: read # check out the repository and read its lockfiles
      security-events: write # upload the SARIF result to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-24.04
      upload-sarif: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  # The full scan of every lockfile against today's advisories, on main and weekly (full-state
  # report). It reports to the Security tab and does not fail on a finding: the alert there, and
  # the matching Dependabot alert Renovate reads for a fix PR, are the signal. It still fails when
  # the scan itself does not complete.
  osv-scanner-full:
    name: osv-scanner-full
    if: github.event_name != 'pull_request'
    permissions:
      actions: read # read the workflow run the SARIF upload belongs to
      contents: read # check out the repository and read its lockfiles
      security-events: write # upload the SARIF result to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-24.04
      fail-on-vuln: false

  # Licenses of the dependencies a pull request adds or changes, from GitHub's dependency graph
  # (WP-6 Q1 answer A). The vulnerability check is off: OSV-Scanner gates vulnerabilities (Q2), so
  # one advisory does not fail two checks. AGPL and GPL are denied for a network service that is
  # deployed; LGPL (sharp's libvips) and the permissive licenses pass. The action diffs base and
  # head through the API, so it needs no checkout. It only means something on a pull request; on
  # other events the job is skipped, which GitHub reports as success.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          license-check: true
          vulnerability-check: false
          deny-licenses: >-
            AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later

  # gitleaks over every commit of the pull request, so a key added and removed inside the PR is
  # still caught, and over the whole history (every ref) on main, weekly and on a manual run
  # (ADR-048, WP-6 D7). Findings are redacted in the log; reviewed false positives live in
  # `.gitleaksignore` by fingerprint. A real finding means rotate the key first, rewrite history
  # second. Same command locally: `pnpm scan:secrets`.
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: the PR range and the full scan both read old commits.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The PR's own commits, base (exclusive) to head; the merge commit is not scanned, it only
      # joins them. The SHAs reach the shell as environment variables.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --verbose --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --verbose --no-banner
