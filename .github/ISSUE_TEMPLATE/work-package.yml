name: Work package
description: One WP from the plan (docs/plan/report.md, section 14). Seeded by scripts/github/seed.mjs; use this form only for a WP that is not in the plan yet.
title: "WP-NN: <title>"
labels: ["type:wp"]
body:
  - type: input
    id: wp
    attributes:
      label: WP id
      placeholder: WP-NN
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release
      options: [R0, R1, R2, R3, R4, R5, R6, R7]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One paragraph. Why this WP exists and what it proves.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable and acceptance criteria
      description: Copy the deliverable from the plan, then one checkbox per acceptance criterion.
      value: |
        Deliverable:

        Acceptance:
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: adrs
    attributes:
      label: ADRs this WP implements
      placeholder: ADR-029, ADR-012
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      placeholder: WP-5, WP-10
  - type: checkboxes
    id: gate
    attributes:
      label: Learning gate (tag:learning only; see report.md 12.3)
      options:
        - label: Explainer written in docs/learning/wp-N.md (or the step is marked `known`, D-38 fast path)
        - label: Decision recorded (ADR link in the explainer front matter)
        - label: Explained back by the owner
  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: Tests green with the coverage gates of ADR-009
        - label: AGENTS.md and docs updated where the WP changed a rule
        - label: Journal post drafted (learning WPs)
        - label: Deployed to staging
        - label: Changelog entry present (release-please)
