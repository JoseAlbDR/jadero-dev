<style>

  --accent: #7cc4ad; --accent-soft: #203a32; --rec: #e3b465; --rec-soft: #3a2f1c;
  --flag: #f0918a; --flag-soft: #3d2120; --chosen: #7cc4ad; color-scheme: dark } }
:root[data-theme="dark"] {

  --accent: #7cc4ad; --accent-soft: #203a32; --rec: #e3b465; --rec-soft: #3a2f1c;
  --flag: #f0918a; --flag-soft: #3d2120; --chosen: #7cc4ad; color-scheme: dark }
* { box-sizing: border-box }

.wrap { max-width: 860px; margin: 0 auto; padding-block: 28px 80px; display: grid; gap: 22px; }
h1 { font: 650 clamp(28px, 5vw, 40px)/1.1 var(--display); margin: 0; text-wrap: balance; }

.st.open { border-color: var(--flag); background: var(--flag-soft); }
.md { max-width: 76ch; font-size: 14.5px; } .md p, .md ul, .md ol { margin: 6px 0; } .md ul, .md ol { padding-left: 20px; } .md code { font: 13px var(--mono); background: var(--accent-soft); padding: 0 4px; border-radius: 3px; } .md h3 { font-size: 16px; margin: 4px 0; } .md table { margin: 6px 0; }

.rv .item.open { border-left: 3px solid var(--flag); } .arrow { font: 500 13px var(--mono); }

.st .h { font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: .05em; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

<div class="wrap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script>
(function () {
  const state = { data: null, marks: {}, filter: 'all', db: null };
  const LS = 'review-marks';
  const $ = (s) => document.querySelector(s);
  const el = (t, a = {}, ...kids) => { const n = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v); } for (const c of kids) if (c != null) n.append(c); return n; };

  const pending = {};

  }

  function items() { return state.data.decisions || []; }

    const all = items(); const decided = all.filter(d => state.marks[d.id] && state.marks[d.id].choice).length;
    const flagged = Object.entries(state.marks).filter(([, m]) => m.detail).length;
    const noted = Object.values(state.marks).filter(m => m.note && m.note.trim()).length;
    $('#stats').replaceChildren(
      el('span', {}, el('b', { text: decided + '/' + all.length }), ' decided'),
      el('span', {}, el('b', { text: String(flagged) }), ' need more detail'),
      el('span', {}, el('b', { text: String(noted) }), ' with notes'));

  }

  function chips() {
    const areas = state.data.areas || [];
    const list = [...(state.data.review ? [{ id: 'review', name: 'Review result' }] : []), { id: 'all', name: 'All' }, ...areas, { id: 'flagged', name: 'Need detail' }, { id: 'open', name: 'Undecided' }];
    if (items().some(d => d.status)) list.push({ id: 'still-open', name: 'Still open after review' });
    if (state.data.review && state.data.review.fullMd) list.push({ id: 'fudoc', name: 'Follow-ups document' });
    if ((state.data.workPackages || []).length) list.push({ id: 'wps', name: 'Work packages' });
    if ((state.data.manualActions || []).length) list.push({ id: 'manual', name: 'Your manual tasks' });
    $('#chips').replaceChildren(...list.map(a => { const b = el('button', { class: 'chip', type: 'button', 'aria-pressed': String(state.filter === a.id), text: a.name }); b.onclick = () => { state.filter = a.id; chips(); render(); }; return b; }));
  }

  function flagBtn(id) {

    return b;
  }
  function noteBox(id, placeholder) {
    const m = state.marks[id] || {};
    const t = el('textarea', { id: 'note-' + id, rows: '2', placeholder });
    t.value = m.note || '';
    let timer; t.oninput = () => { clearTimeout(timer); timer = setTimeout(() => save(id, { note: t.value }), 700); };
    t.onblur = () => { clearTimeout(timer); if ((state.marks[id] || {}).note !== t.value) save(id, { note: t.value }); };
    return t;
  }

  function decisionCard(d) {
    const m = state.marks[d.id] || {};
    const card = el('article', { class: 'card' + (m.detail ? ' flagged' : ''), id: 'item-' + d.id });
    card.append(el('div', { class: 'head' }, el('span', { class: 'id', text: d.id }), el('h3', { text: d.title }), d.adr ? el('span', { class: 'tag', text: d.adr }) : null));
    if (d.question) card.append(el('p', { class: 'q', text: d.question }));
    if (d.status) {
      const labels = { 'decided': 'Decided', 'decided-with-change': 'Decided, with a change from your note', 'open': 'Still open' + (d.followup ? ' (' + d.followup + ' in the follow-ups)' : '') };
      const st = el('div', { class: 'st' + (d.status === 'open' ? ' open' : '') }, el('span', { class: 'h', text: labels[d.status] || d.status }));
      if (d.decidedOption) st.append(el('span', { text: 'Outcome: option (' + d.decidedOption + ')' }));
      if (d.change) st.append(el('span', {}, el('b', { text: 'Change: ' }), d.change));
      if (d.openQuestion) st.append(el('span', {}, el('b', { text: 'Pending question: ' }), d.openQuestion));
      if (d.previousRecommendation && d.previousRecommendation !== d.recommendation) st.append(el('span', { text: 'The recommendation moved from (' + d.previousRecommendation + ') to (' + d.recommendation + ') after your note.' }));
      card.append(st);
    }
    if (d.quote) card.append(el('p', { class: 'quote', text: d.quote }));
    if (d.context) card.append(el('p', { class: 'ctx', text: d.context }));
    const opts = el('div', { class: 'opts' });
    for (const o of d.options || []) {
      const b = el('button', { class: 'opt', type: 'button', 'aria-pressed': String(m.choice === o.id) });
      b.append(el('span', { class: 'l' }, el('span', { text: '(' + o.id + ') ' + o.label }), d.recommendation === o.id ? el('span', { class: 'rec', text: 'recommended' }) : null));
      if (o.description) b.append(el('span', { class: 'd', text: o.description }));
      if ((o.pros || []).length || (o.cons || []).length) {
        const pc = el('span', { class: 'pc' });
        pc.append(el('span', {}, el('span', { class: 'h', text: 'Pros' }), el('ul', {}, ...(o.pros || []).map(x => el('li', { text: x })))));
        pc.append(el('span', {}, el('span', { class: 'h', text: 'Cons' }), el('ul', {}, ...(o.cons || []).map(x => el('li', { text: x })))));
        b.append(pc);
      }
      b.onclick = () => { save(d.id, { choice: (state.marks[d.id] || {}).choice === o.id ? null : o.id }); render(); };
      opts.append(b);
    }
    card.append(opts);
    if (d.editable && m.choice === 'edit') {
      const t = el('textarea', { id: 'edit-' + d.id, rows: '3', placeholder: 'Your corrected wording' });
      t.value = m.edit != null ? m.edit : (d.quote || '');
      t.onblur = () => { if ((state.marks[d.id] || {}).edit !== t.value) save(d.id, { edit: t.value }); };
      card.append(t);
    }
    { const R = state.data.review || {}; const a = (R.answers || {})[d.id] || (R.changes || {})[d.id] || (R.recorded || {})[d.id];
      const fu = d.followup && (R.followupItems || {})[d.followup];
      if (fu) card.append(el('details', {}, el('summary', { text: 'Follow-up ' + d.followup + ': the conflict and the recommendation' }), mdNode(fu.md)));
      else if (a) card.append(el('details', {}, el('summary', { text: 'Answer to your note' }), mdNode(a))); }
    if (d.why) card.append(el('details', {}, el('summary', { text: 'Why this recommendation, and what was discarded' }), el('p', { text: d.why })));
    if (d.learn) card.append(el('p', { class: 'learn' }, el('b', { text: 'You learn: ' }), d.learn));
    card.append(el('div', { class: 'ctl' }, flagBtn(d.id), el('span', { class: 'saved', id: 'saved-' + d.id })));
    card.append(noteBox(d.id, 'Notes or questions for this item (what is unclear, what you want explained)'));
    return card;
  }


  function mdNode(text) {
    const n = el('div', { class: 'md' });
    if (window.marked && window.DOMPurify) n.innerHTML = DOMPurify.sanitize(marked.parse(text || ''));
    else n.append(el('p', { class: 'quote', text: text || '' }));
    return n;
  }
  function byId(id) { return items().find(x => x.id === id); }
  function optName(d, id) { if (!id) return 'none'; const o = (d.options || []).find(x => x.id === id); return '(' + id + ') ' + (o ? o.label : ''); }
  function jump(id) { const b = el('button', { class: 'jump', type: 'button', text: 'Open ' + id + ' card' }); b.onclick = () => { state.filter = 'all'; chips(); render(); const t = document.getElementById('item-' + id); if (t) t.scrollIntoView({ block: 'start' }); }; return b; }
  function sec(title, intro) { const s = el('section', { class: 'area rv' }, el('h2', { text: title })); if (intro) s.append(el('p', { class: 'intro', text: intro })); return s; }
  function reviewView(list) {
    const R = state.data.review; const all = items(); const c = R.counts || {};
    const top = sec('Review result (' + R.date + ')', c.decided + ' decided as you marked them, ' + c['decided-with-change'] + ' decided with a change from your note, ' + c.open + ' still open. Each section below links to the full decision card.');
    list.append(top);
    const deps = sec('Blockers and order');
    deps.append(el('ul', {}, ...(R.dependencies || []).map(x => el('li', { text: x })))); list.append(deps);
    const open = all.filter(d => d.status === 'open');
    const s1 = sec('1. Waiting on you (' + open.length + ')', 'Your pick, the question still open, and the recommendation. Expand an item for the full analysis.');
    const fuOrder = Object.keys(R.followupItems || {}).sort((a, b) => +a.slice(2) - +b.slice(2));
    for (const f of fuOrder) {
      const it = R.followupItems[f]; const d = byId(it.decision); if (!d) continue; const m = state.marks[d.id] || {};
      const box = el('div', { class: 'item open' }, el('div', { class: 'head' }, el('span', { class: 'id', text: f + ' · ' + d.id }), el('h3', { text: d.title })));
      box.append(el('span', { class: 'arrow', text: 'You picked ' + optName(d, m.choice || d.ownerPick) + '  ·  recommended now ' + optName(d, d.recommendation) }));
      if (d.openQuestion) box.append(el('p', { class: 'q', text: d.openQuestion }));
      box.append(el('details', {}, el('summary', { text: 'Full analysis and your note' }), mdNode(it.md)));
      box.append(jump(d.id)); s1.append(box);
    }
    list.append(s1);
    const ch = all.filter(d => d.status === 'decided-with-change');
    const s2 = sec('2. Changed by your note (' + ch.length + ')', 'Your pick stands; your note added something to it. Please check each one.');
    for (const d of ch) {
      const m = state.marks[d.id] || {};
      const box = el('div', { class: 'item' }, el('div', { class: 'head' }, el('span', { class: 'id', text: d.id }), el('h3', { text: d.title })));
      box.append(el('span', { class: 'arrow', text: 'You picked ' + optName(d, m.choice) + '  →  outcome ' + optName(d, d.decidedOption) + ' plus the change below' }));
      if (d.change) box.append(el('p', {}, el('b', { text: 'Change: ' }), d.change));
      const a = (R.changes || {})[d.id]; if (a) box.append(el('details', {}, el('summary', { text: 'Full explanation' }), mdNode(a)));
      box.append(jump(d.id)); s2.append(box);
    }
    list.append(s2);
    const mv = all.filter(d => d.previousRecommendation && d.previousRecommendation !== d.recommendation);
    const s3 = sec('3. Recommendation moved because of your note (' + mv.length + ')', 'All of these are in section 1; this is the from-to view.');
    const tb = el('tbody');
    for (const d of mv) { const m = state.marks[d.id] || {}; const tr = el('tr', {}, el('td', { text: d.id + ' ' + d.title }), el('td', { text: optName(d, m.choice) }), el('td', { text: optName(d, d.previousRecommendation) + '  →  ' + optName(d, d.recommendation) })); const td = el('td'); td.append(jump(d.id)); tr.append(td); tb.append(tr); }
    s3.append(el('div', { class: 'tablewrap' }, el('table', {}, el('thead', {}, el('tr', {}, el('th', { text: 'Decision' }), el('th', { text: 'Your pick' }), el('th', { text: 'Recommendation was → now' }), el('th', { text: '' }))), tb)));
    list.append(s3);
    const noted = all.filter(d => (state.marks[d.id] || {}).note && state.marks[d.id].note.trim());
    const s4 = sec('4. Your notes and their answers (' + noted.length + ')', 'Every note you wrote, with where it was answered.');
    for (const d of noted) {
      const a = (R.answers || {})[d.id] || (R.changes || {})[d.id] || (R.recorded || {})[d.id] || (d.followup && (R.followupItems || {})[d.followup] || {}).md;
      const where = (R.answers || {})[d.id] ? 'Answered' : (R.changes || {})[d.id] ? 'Applied as a change' : (R.recorded || {})[d.id] ? 'Recorded, no action needed' : d.followup ? 'Open, see ' + d.followup : 'Recorded with the decision';
      const box = el('div', { class: 'item' + (d.status === 'open' ? ' open' : '') }, el('div', { class: 'head' }, el('span', { class: 'id', text: d.id }), el('h3', { text: d.title }), el('span', { class: 'tag', text: where })));
      box.append(el('p', { class: 'mine', text: state.marks[d.id].note }));
      if (a) box.append(el('details', {}, el('summary', { text: 'Answer' }), mdNode(a)));
      box.append(jump(d.id)); s4.append(box);
    }
    list.append(s4);
    const s5 = sec('5. Plan changes from the review'); s5.append(el('ul', {}, ...(R.planChanges || []).map(x => el('li', { text: x })))); list.append(s5);
    if (R.firstmate) { const s6 = sec('6. Requests for firstmate'); s6.append(mdNode(R.firstmate)); list.append(s6); }
  }

  function tableSection(title, rows, cols, idKey) {
    const sec = el('section', { class: 'area' }, el('h2', { text: title }));
    const tb = el('tbody');
    for (const r of rows) {
      const tr = el('tr');
      for (const c of cols) { const v = r[c.k]; tr.append(el('td', { text: Array.isArray(v) ? v.join(', ') : (v == null ? '' : String(v)) })); }
      const td = el('td'); td.append(flagBtn(r[idKey])); tr.append(td); tb.append(tr);
    }
    sec.append(el('div', { class: 'tablewrap' }, el('table', {}, el('thead', {}, el('tr', {}, ...cols.map(c => el('th', { text: c.h })), el('th', { text: '' }))), tb)));
    return sec;
  }

  function render() {
    const list = $('#list'); list.replaceChildren();
    const f = state.filter; const areas = state.data.areas || [];
    if (f === 'review') { reviewView(list); return; }
    if (f === 'fudoc') { const s = sec('Follow-ups document'); s.append(mdNode(state.data.review.fullMd)); list.append(s); return; }
    if (f === 'wps') { list.append(tableSection('Work packages', state.data.workPackages, [{ k: 'id', h: 'WP' }, { k: 'milestone', h: 'Milestone' }, { k: 'title', h: 'Title' }, { k: 'tag', h: 'Tag' }, { k: 'size', h: 'Size' }, { k: 'dependsOn', h: 'After' }, { k: 'deliverable', h: 'Deliverable' }, { k: 'learns', h: 'You learn' }], 'id')); return; }
    if (f === 'manual') { list.append(tableSection('Your manual tasks', state.data.manualActions, [{ k: 'what', h: 'What' }, { k: 'when', h: 'When' }, { k: 'why', h: 'Why' }], 'id')); return; }
    const pick = (d) => f === 'all' || d.area === f || (f === 'flagged' && (state.marks[d.id] || {}).detail) || (f === 'open' && !(state.marks[d.id] || {}).choice) || (f === 'still-open' && d.status === 'open');
    let shown = 0;
    for (const a of areas) {
      const ds = items().filter(d => d.area === a.id && pick(d)); if (!ds.length) continue; shown += ds.length;
      const sec = el('section', { class: 'area', id: 'area-' + a.id }, el('h2', { text: a.name }));
      if (a.intro) sec.append(el('p', { class: 'intro', text: a.intro }));
      for (const d of ds) sec.append(decisionCard(d));
      sec.append(el('div', { class: 'ctl' }, flagBtn('area:' + a.id), el('span', { class: 'saved', text: 'for the whole section' })));
      list.append(sec);
    }
    if (!shown) list.append(el('p', { class: 'empty', text: f === 'flagged' ? 'Nothing marked for more detail yet. Use "Need more detail" on any item.' : 'Nothing here: every item in this view is decided.' }));
  }

  async function boot() {
    try { const r = await fetch('data.json'); state.data = await r.json(); }
    catch (e) { $('#summary').textContent = 'The review data could not load. Reload the page.'; return; }
    document.title = state.data.title || document.title;
    $('#title').textContent = state.data.title; $('#summary').textContent = state.data.summary || '';
    if (state.data.review) state.filter = 'review';
    state.marks = lsLoad(); chips(); stats(); render();
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) { $('#notice').hidden = false; $('#notice').textContent = 'Shared saving is unavailable in this view, so your marks stay in this browser only.'; return; }
    state.db = db;
    db.collection('marks').onSnapshot((qs) => {
      const fresh = {}; for (const d of qs.docs) fresh[d.id] = d.data();
      const focused = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
      state.marks = Object.assign({}, state.marks, fresh); lsSave(); stats();
      if (!focused) render();
    }, (e) => { $('#notice').hidden = false; $('#notice').textContent = 'Live sync stopped (' + (e && e.code || 'error') + '). Reload to reconnect.'; });
  }
  boot();
})();
</script>

</body></html>
