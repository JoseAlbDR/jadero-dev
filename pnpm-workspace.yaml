packages:
  - "apps/*"
  - "packages/*"

# One version per tool for the whole repo (single-version policy). Packages write "catalog:".
catalog:
  "@biomejs/biome": 2.5.15
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@nestjs/common": 12.1.2
  "@nestjs/core": 12.1.2
  "@nestjs/platform-express": 12.1.2
  "@nestjs/testing": 12.1.2
  "@types/express": 5.0.6
  "@types/node": 24.19.1
  dependency-cruiser: 18.5.0
  lefthook: 2.1.16
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.1.3
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  turbo: 2.11.7
  typescript: 6.0.3
  vitest: 5.0.3
  zod: 4.6.5

# Dependency install scripts stay off (pnpm 11 fails the install on an undecided one).
# lefthook's postinstall only runs `lefthook install`, which the root `prepare` script already does.
allowBuilds:
  lefthook: false

# Fail the install, instead of warning, when Node or pnpm is outside the root `engines` range.
engineStrict: true
