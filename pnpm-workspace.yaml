# Dependency install scripts stay off (pnpm 11 fails the install on an undecided one).
# lefthook's postinstall only runs `lefthook install`, which the root `prepare` script already does.
allowBuilds:
  # @asyncapi/parser -> @stoplight/spectral-core -> @scarf/scarf: its postinstall only sends download analytics.
  "@scarf/scarf": false
  # next-intl (message extraction tooling): both ship prebuilt binaries as optional dependencies;
  # their install scripts only build from source or check for a binary when none matches.
  "@parcel/watcher": false
  "@swc/core": false
  # testcontainers -> ssh2 -> cpu-features: optional native bindings for Docker over SSH; ssh2 works without them.
  cpu-features: false
  # drizzle-kit (dev only, ADR-005) -> esbuild: its postinstall only checks the platform binary that pnpm already
  # installs as an optional dependency (@esbuild/<platform>), and downloads one when it is missing.
  esbuild: false
  lefthook: false
  # dockerode and @nestjs/terminus (through @grpc/proto-loader): its postinstall only prints a version notice.
  protobufjs: false
  ssh2: false

# drizzle-kit (dev only) -> @esbuild-kit/esm-loader -> @esbuild-kit/core-utils pins esbuild 0.18, which has the
# dev-server advisory GHSA-67mh-4wv8-2f99 (any website can read responses from `esbuild serve`). Nothing here runs
# `esbuild serve`, but the lockfile should not carry it: core-utils only calls `transform`, which 0.25 keeps.
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.0

# Fail the install, instead of warning, when Node or pnpm is outside the root `engines` range.
engineStrict: true

# Release cooldown (ADR-048, WP-6 D9): refuse any version published less than three days ago
# (4320 minutes). Most malicious npm releases are found and pulled within that window. pnpm
# already defaults to one day, but softly (it falls back, or lets an exact pin through); setting
# the value here makes it strict: the install fails in CI and asks on a developer's machine.
# Renovate waits the same three days before it opens an update.
# For an urgent fix that cannot wait, add the exact version below with a comment saying why
# (advisory id or bug, date) and remove the entry once the version is three days old:
# minimumReleaseAgeExclude:
#   # GHSA-xxxx-xxxx-xxxx, 2026-10-11: fixes a remote code execution we ship; drop after 2026-10-14.
#   - some-package@1.2.3
minimumReleaseAge: 4320
