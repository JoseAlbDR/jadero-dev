# Proxy settings of every server that proxies to a service on 127.0.0.1 (WP-8 D6). Included once at
# the `server` level; no `location` of ours sets proxy_set_header or proxy_hide_header, because
# one that did would drop every value inherited from here (`scripts/nginx-hardening.test.mjs`).

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The client address goes to the upstream (rate limits, Umami's daily visitor hash), replacing any
# X-Forwarded-For the client sent; the services hash it before they log it (AGENTS.md section 7).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Headers that disclose the upstream's stack (ADR-047).
proxy_hide_header X-Powered-By;
# The edge owns these (jadero-security-headers.conf): the upstream copies are dropped, so each
# header appears once with the edge's value.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
# No CORS on any host (ADR-047), even when an upstream sends it.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
