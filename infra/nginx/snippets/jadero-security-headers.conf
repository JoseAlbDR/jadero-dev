# The edge headers of every HTTPS server (ADR-047, WP-8 D6). Included once at the `server` level of
# each server on 443, and no `location` of ours sets add_header: a location that did would drop
# every header inherited from here (`scripts/nginx-hardening.test.mjs` checks both).
#
# `always` adds each header to error responses too (404, 429, 502), not only to 2xx and 3xx.
# No Access-Control-* header on any host: same origin per audience (ADR-002), so no browser call
# is cross-origin; opening CORS needs a new ADR. The proxy snippet hides the upstream copies of
# these headers, so each appears once.

# Short trial first (ADR-047): max-age=300, no includeSubDomains, no preload. After a week without
# problems: "max-age=31536000; includeSubDomains".
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Every powerful feature off for every origin, the page's own included.
add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
