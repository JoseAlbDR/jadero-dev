# Limits of every API location (ADR-047, WP-8 D6), included inside each `location` that proxies a
# JSON or collect API. limit_req and client_max_body_size add no headers, so including them in a
# location keeps every header inherited from the server.

# About 10 requests a second per client address, a burst of 20 served at once, then 429
# (the zone and the status are in nginx.conf).
limit_req zone=jadero_api burst=20 nodelay;
# Below the services' 100 KB JSON limit, so the edge refuses first (413).
client_max_body_size 64k;
