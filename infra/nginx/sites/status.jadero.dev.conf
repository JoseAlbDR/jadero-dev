# status.jadero.dev: only Uptime Kuma's public status page `jadero` (WP-8 Q2 option B). The page and
# the API paths and static files it loads are proxied to Uptime Kuma on 127.0.0.1:3101; the
# dashboard, its socket.io channel, the setup page, /metrics, push and badge URLs and every other
# path answer 404 here. The admin screens are reached over the tailnet through an SSH tunnel.
#
# Paths read from the pinned image (uptime-kuma 2.5.6-slim-rootless, see docs/learning/wp-8.md,
# Facts checked): server/routers/status-page-router.js serves the page and its API; the page's
# script (src/mixins/socket.js) opens no socket.io connection on /status/*; dist/ holds the bundles
# under /assets/ and the icons; uploaded logos live under /upload/. A Kuma upgrade may change
# them: smoke-edge.sh and a look at the page catch a broken status page.

server {
	listen 80;
	listen [::]:80;
	server_name status.jadero.dev;

	access_log /var/log/nginx/status.jadero.dev.access.log jadero;
	error_log /var/log/nginx/jadero/status.jadero.dev.error.log;

	# In a location, so certbot's HTTP-01 location for a renewal still wins.
	location / {
		return 301 https://status.jadero.dev$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name status.jadero.dev;

	ssl_certificate /etc/letsencrypt/live/status.jadero.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/status.jadero.dev/privkey.pem;

	access_log /var/log/nginx/status.jadero.dev.access.log jadero;
	error_log /var/log/nginx/jadero/status.jadero.dev.error.log;

	include snippets/jadero-security-headers.conf;
	include snippets/jadero-proxy.conf;

	# The host's root goes to the one status page (302: the slug may change).
	location = / {
		return 302 /status/jadero;
	}

	# The status page and its RSS feed.
	location = /status/jadero {
		proxy_pass http://127.0.0.1:3101;
	}

	location = /status/jadero/rss {
		proxy_pass http://127.0.0.1:3101;
	}

	# The JSON the page loads: its configuration, heartbeats, manifest, incident history and badge.
	location ~ ^/api/status-page/(?:jadero|heartbeat/jadero|jadero/(?:manifest\.json|incident-history|badge))$ {
		include snippets/jadero-api-limits.conf;
		proxy_pass http://127.0.0.1:3101;
	}

	# The page's script and style bundles, and the status page logo.
	location /assets/ {
		proxy_pass http://127.0.0.1:3101;
	}

	location /upload/ {
		proxy_pass http://127.0.0.1:3101;
	}

	# The icons and the service worker index.html references, and robots.txt.
	location ~ ^/(?:favicon\.ico|icon\.svg|apple-touch-icon\.png|icon-192x192\.png|icon-512x512\.png|serviceWorker\.js|robots\.txt)$ {
		proxy_pass http://127.0.0.1:3101;
	}

	# Deny by default: the dashboard, /api/ and every other path.
	location / {
		return 404;
	}
}
