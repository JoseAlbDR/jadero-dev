# new.jadero.dev: the staging site during the build (ADR-050 restating ADR-027; WP-8 D6).
#
# Allowlist routing: the site goes to `web`, the public content API to `api`, Umami's tracker and
# its collect endpoint to Umami under /s/ (ADR-051), and every other /api/ and /s/ path answers 404
# here, so an internal route (health, revalidation, the MCP edge's internal calls, Umami's login
# and dashboards) stays closed until someone opens it on purpose.
#
# Upstreams on 127.0.0.1, staging ports: web 3120, api 3121 (production, at the cutover in WP-29:
# web 3110, api 3111). Until WP-9 deploys staging, both answer 502. Umami on 3100 is the ops
# stack's, shared by staging and production.

server {
	listen 80;
	listen [::]:80;
	server_name new.jadero.dev;

	access_log /var/log/nginx/new.jadero.dev.access.log jadero;
	error_log /var/log/nginx/new.jadero.dev.error.log;

	# In a location, not at the server level, so the exact-match location certbot's nginx
	# authenticator adds for a renewal's HTTP-01 challenge still wins.
	location / {
		return 301 https://new.jadero.dev$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name new.jadero.dev;

	ssl_certificate /etc/letsencrypt/live/new.jadero.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/new.jadero.dev/privkey.pem;

	access_log /var/log/nginx/new.jadero.dev.access.log jadero;
	error_log /var/log/nginx/new.jadero.dev.error.log;

	include snippets/jadero-security-headers.conf;
	include snippets/jadero-proxy.conf;

	# The public site (web sets its own nonce CSP, ADR-047).
	location / {
		proxy_pass http://127.0.0.1:3120;
	}

	# The public content API, /api/v1/content/... to /v1/content/... on api.
	location /api/v1/content/ {
		include snippets/jadero-api-limits.conf;
		proxy_pass http://127.0.0.1:3121/v1/content/;
	}

	# Deny by default: every other /api/ path (api's /health/*, web's own /api/ routes).
	location /api/ {
		return 404;
	}

	# Umami's tracker, first-party (ADR-051): same origin as the page, so the collect call needs
	# no CORS and the site's CSP needs no extra source. Exact matches, checked before any prefix,
	# each mapped to Umami's own path. The script posts to `<its own folder>/api/send`, so loaded
	# from /s/script.js it posts to /s/api/send (read from the pinned 3.4.0 image). Umami sends
	# `Access-Control-Allow-Origin: *` on both; the proxy snippet hides it.
	location = /s/script.js {
		proxy_pass http://127.0.0.1:3100/script.js;
	}

	# The collect endpoint: POST only (any other method gets 403), with the API limits.
	location = /s/api/send {
		limit_except POST {
			deny all;
		}
		include snippets/jadero-api-limits.conf;
		proxy_pass http://127.0.0.1:3100/api/send;
	}

	# Deny by default: every other Umami path (login, dashboards, its API, the session recorder).
	location /s/ {
		return 404;
	}
}
