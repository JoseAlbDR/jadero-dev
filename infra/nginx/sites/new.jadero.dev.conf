# new.jadero.dev: the staging site during the build (ADR-050 restating ADR-027; WP-8 D6).
#
# Allowlist routing: the site goes to `web`, the public content API to `api`, Umami's tracker and
# its collect endpoint to Umami under /s/ (ADR-051), and every other /api/ and /s/ path answers 404
# here, so an internal route (health, revalidation, the MCP edge's internal calls, Umami's login
# and dashboards) stays closed until someone opens it on purpose.
#
# Upstreams on 127.0.0.1, staging ports: web 3120, api 3121 (production, at the cutover in WP-29:
# web 3110, api 3111). Umami on 3100 is the ops stack's, shared by staging and production.
#
# Maintenance page (WP-9 step 4; ADR-049 restating ADR-026 "Downtime"): a deploy recreates a
# service's containers, which costs a few seconds in which nginx gets no answer from the upstream.
# nginx then serves /srv/jadero/www/maintenance/maintenance.html with the original status (502,
# 503 or 504) instead of its bare error page. The public content API gets a machine-readable
# answer instead (WP-9 step 5 review): /srv/jadero/www/maintenance/maintenance.problem.json, an
# RFC 9457 problem details body as application/problem+json, always with status 503, so a client
# of the API never parses an HTML page. Only errors nginx generates itself: a response the upstream
# sends (api's own 503 problem details) passes through untouched.

# The page's own headers. They are added at the server level with a value only for the page:
# add_header skips a header whose value is empty, so every proxied response keeps its own
# Cache-Control and web keeps its nonce CSP, and no location sets add_header (which would drop
# the edge headers it inherits). The page is never cached, gets a static CSP (nginx serves it, so
# nginx owns it, as for admin), and a 503 says when to retry. The same for the API's problem body.
map $uri $jadero_maintenance_cache_control {
	/maintenance.html "no-store";
	/maintenance.problem.json "no-store";
	default "";
}

map $uri $jadero_maintenance_csp {
	/maintenance.html "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
	/maintenance.problem.json "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
	default "";
}

map "$uri:$status" $jadero_maintenance_retry_after {
	"/maintenance.html:503" "10";
	"/maintenance.problem.json:503" "10";
	default "";
}

server {
	listen 80;
	listen [::]:80;
	server_name new.jadero.dev;

	access_log /var/log/nginx/new.jadero.dev.access.log jadero;
	error_log /var/log/nginx/jadero/new.jadero.dev.error.log;

	# In a location, not at the server level, so the exact-match location certbot's nginx
	# authenticator adds for a renewal's HTTP-01 challenge still wins.
	location / {
		return 301 https://new.jadero.dev$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name new.jadero.dev;

	ssl_certificate /etc/letsencrypt/live/new.jadero.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/new.jadero.dev/privkey.pem;

	access_log /var/log/nginx/new.jadero.dev.access.log jadero;
	error_log /var/log/nginx/jadero/new.jadero.dev.error.log;

	include snippets/jadero-security-headers.conf;
	include snippets/jadero-proxy.conf;

	# The maintenance page on the errors nginx generates while an upstream is down (top of file).
	# nginx turns the redirect into a GET, so a POST that meets a recreate gets the page too.
	error_page 502 503 504 /maintenance.html;
	add_header Cache-Control $jadero_maintenance_cache_control always;
	add_header Content-Security-Policy $jadero_maintenance_csp always;
	add_header Retry-After $jadero_maintenance_retry_after always;

	# Reached only through error_page: a client asking for it directly gets 404.
	location = /maintenance.html {
		internal;
		root /srv/jadero/www/maintenance;
	}

	# The API's maintenance answer, reached only through the API location's error_page.
	location = /maintenance.problem.json {
		internal;
		root /srv/jadero/www/maintenance;
		types { }
		default_type application/problem+json;
	}

	# The public site (web sets its own nonce CSP, ADR-047).
	location / {
		proxy_pass http://127.0.0.1:3120;
	}

	# The public content API, /api/v1/content/... to /v1/content/... on api.
	# While api is down, the problem details body, always 503 (=503), never the HTML page; an
	# error_page here replaces the server's for this location only.
	location /api/v1/content/ {
		include snippets/jadero-api-limits.conf;
		error_page 502 503 504 =503 /maintenance.problem.json;
		proxy_pass http://127.0.0.1:3121/v1/content/;
	}

	# Deny by default: every other /api/ path (api's /health/*, web's own /api/ routes).
	location /api/ {
		return 404;
	}

	# Umami's tracker, first-party (ADR-051): same origin as the page, so the collect call needs
	# no CORS and the site's CSP needs no extra source. Exact matches, checked before any prefix,
	# each mapped to Umami's own path. The script posts to `<its own folder>/api/send`, so loaded
	# from /s/script.js it posts to /s/api/send (read from the pinned 3.4.0 image). Umami sends
	# `Access-Control-Allow-Origin: *` on both; the proxy snippet hides it.
	location = /s/script.js {
		proxy_pass http://127.0.0.1:3100/script.js;
	}

	# The collect endpoint: POST only (any other method gets 403), with the API limits.
	location = /s/api/send {
		limit_except POST {
			deny all;
		}
		include snippets/jadero-api-limits.conf;
		proxy_pass http://127.0.0.1:3100/api/send;
	}

	# Deny by default: every other Umami path (login, dashboards, its API, the session recorder).
	location /s/ {
		return 404;
	}
}
