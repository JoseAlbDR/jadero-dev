# admin.jadero.dev: the admin SPA's host (ADR-002, ADR-047; WP-8 D6). Until WP-17 builds the SPA and
# its API routes, it serves one static placeholder page from /srv/jadero/www/admin under a strict
# static CSP, and every /api/ path answers 404.

server {
	listen 80;
	listen [::]:80;
	server_name admin.jadero.dev;

	access_log /var/log/nginx/admin.jadero.dev.access.log jadero;
	error_log /var/log/nginx/jadero/admin.jadero.dev.error.log;

	# In a location, so certbot's HTTP-01 location for a renewal still wins.
	location / {
		return 301 https://admin.jadero.dev$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name admin.jadero.dev;

	ssl_certificate /etc/letsencrypt/live/admin.jadero.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/admin.jadero.dev/privkey.pem;

	access_log /var/log/nginx/admin.jadero.dev.access.log jadero;
	error_log /var/log/nginx/jadero/admin.jadero.dev.error.log;

	include snippets/jadero-security-headers.conf;
	# The admin SPA's static CSP (ADR-047): nginx serves its files, so nginx owns it. Set at the
	# server level next to the snippet, never in a location. The placeholder needs only its own
	# styles; WP-17 widens it for the SPA's hashed bundles.
	add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

	root /srv/jadero/www/admin;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	# Deny by default until WP-17 opens the admin API routes.
	location /api/ {
		return 404;
	}
}
