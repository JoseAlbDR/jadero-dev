# stats.jadero.dev: only Umami's public part (WP-8 Q2 option B). The tracker script and the endpoint
# it posts page views to are proxied to Umami on 127.0.0.1:3100; everything else, the login page
# and the dashboards included, answers 404 here. The admin screens are reached over the tailnet
# through an SSH tunnel.
#
# Paths read from the pinned image (umami 3.4.0, see docs/learning/wp-8.md, Facts checked): the
# script is public/script.js, and it posts to `<its own folder>/api/send`. Umami's /api/ routes
# send `Access-Control-Allow-Origin: *`; the proxy snippet hides it (ADR-047, no CORS on any host).

server {
	listen 80;
	listen [::]:80;
	server_name stats.jadero.dev;

	access_log /var/log/nginx/stats.jadero.dev.access.log jadero;
	error_log /var/log/nginx/stats.jadero.dev.error.log;

	# In a location, so certbot's HTTP-01 location for a renewal still wins.
	location / {
		return 301 https://stats.jadero.dev$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name stats.jadero.dev;

	ssl_certificate /etc/letsencrypt/live/stats.jadero.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/stats.jadero.dev/privkey.pem;

	access_log /var/log/nginx/stats.jadero.dev.access.log jadero;
	error_log /var/log/nginx/stats.jadero.dev.error.log;

	include snippets/jadero-security-headers.conf;
	include snippets/jadero-proxy.conf;

	# The tracker script.
	location = /script.js {
		proxy_pass http://127.0.0.1:3100;
	}

	# The collect endpoint the script posts page views to.
	location = /api/send {
		include snippets/jadero-api-limits.conf;
		proxy_pass http://127.0.0.1:3100;
	}

	# Deny by default: the admin app, its API and every other path.
	location / {
		return 404;
	}
}
