# The catch-all default server (WP-8 step 5, the 2026-10-18 amendment). A request whose name no
# other server claims (a scan by address, a stale DNS record, a Host header made up) gets nothing:
# on 443 the TLS handshake is refused before any certificate is shown, so our names never leak to
# a scan of the address; on 80 nginx closes the connection without a response (444).
#
# The only `default_server` on the host: Ubuntu's sites-enabled/default and any older vhost that
# says default_server must drop it, or `nginx -t` fails with "duplicate default server".
# The 00- prefix sorts it first in sites-enabled, which nginx does not need but a reader does.

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	access_log /var/log/nginx/default.access.log jadero;
	error_log /var/log/nginx/jadero/default.error.log;

	return 444;
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	access_log /var/log/nginx/default.access.log jadero;
	error_log /var/log/nginx/jadero/default.error.log;

	ssl_reject_handshake on;
}
