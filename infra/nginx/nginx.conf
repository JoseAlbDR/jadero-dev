# /etc/nginx/nginx.conf for the jadero.dev host (WP-8 step 5; ADR-047's edge part, ADR-050 restating
# ADR-027's host nginx and certbot). Ubuntu 26.04's packaged file (nginx 1.28.3-2ubuntu1.11) with
# these changes, so every site on the host, ours and the older ones kept outside the repo, gets
# them from one place (the 2026-10-18 amendment in docs/learning/wp-8.md):
#
# - `server_tokens off` instead of `build`: no version in the Server header or on error pages.
# - The TLS policy in `http`: TLS 1.2 and 1.3, Mozilla's "intermediate" ciphers and curves
#   (guidelines 6.0), a shared session cache and no session tickets. Set here and nowhere else, so
#   the default server of a shared address can never hand a weaker list to our names.
# - The `jadero` access log format: the client network instead of the client address, the path
#   without its query string, and no headers (AGENTS.md section 7: no IPs in clear).
# - The `jadero_api` request rate zone, used by the API locations, answering 429.
# - An explicit request body limit; API locations set a smaller one.
#
# No OCSP stapling: Let's Encrypt certificates carry no OCSP URL since 2025 (D6).
# Each directive appears once per level; `scripts/nginx-hardening.test.mjs` checks it.

user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
# error_log always writes the client address and the request line, query string included, of the
# request that caused an entry (an upstream that refuses, a rate limit); nginx has no format for
# it. The jadero sites set their own, under /var/log/nginx/jadero/, kept three days by
# infra/logrotate/jadero-nginx (ADR-052). This global one is for the sites without their own (the
# owner's older sites, not in this repo) and stays on Ubuntu's rule (/etc/logrotate.d/nginx:
# daily, 14 files).
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# 1 MiB for any request body; JSON API locations lower it to 64 KiB, below the services' own
	# JSON limit (HTTP_JSON_BODY_LIMIT, 100 KB), so the edge refuses first (ADR-047).
	client_max_body_size 1m;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
	ssl_prefer_server_ciphers off; # Don't force server cipher order.
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	##
	# Logging Settings
	##

	# The client's network, never its address: the last IPv4 octet and all but the first three
	# IPv6 groups are dropped (/24 and /48). Compressed IPv6 forms with fewer leading groups keep
	# what they have. Anything else logs a dash. The patterns are quoted because of their braces.
	map $remote_addr $jadero_client_net {
		"~^(\d+\.\d+\.\d+)\.\d+$" $1.0/24;
		"~*^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $1::/48;
		"~*^([0-9a-f]{1,4}:[0-9a-f]{1,4})::" $1::/48;
		"~*^([0-9a-f]{1,4})::" $1::/48;
		default -;
	}

	# $uri is the path without the query string; $request, $request_uri and $remote_addr are never
	# logged. Headers (cookies, user agent, referer) stay out too.
	log_format jadero '$time_iso8601 $jadero_client_net $host "$request_method $uri $server_protocol" '
		'$status $body_bytes_sent $request_time upstream=$upstream_status';

	access_log /var/log/nginx/access.log jadero;

	##
	# Rate limits
	##

	# About 10 requests a second per client address on the API locations, with a burst of 20
	# served at once (`limit_req zone=jadero_api burst=20 nodelay;`). The key lives only in this
	# shared memory zone, never in a log line.
	limit_req_zone $binary_remote_addr zone=jadero_api:10m rate=10r/s;
	limit_req_status 429;
	limit_req_log_level warn;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
