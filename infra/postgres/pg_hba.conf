# Client authentication of the server's Postgres (WP-8 D4, ADR-050, ADR-029). Staging and
# production share one Postgres; each role is accepted only from its own environment's Docker
# network, only on its own database, and only with scram-sha-256. Everything else is rejected.
#
# Mounted read-only by infra/compose/compose.ops.yml and named with `-c hba_file=...`, so the
# pg_hba.conf the image writes into the data folder is never read. Not used by dev:
# compose.dev.yml keeps the image's default (Postgres bound to 127.0.0.1 on the laptop) and the
# integration tests run on throwaway containers with the default too.
#
# Networks (fixed subnets, D4 and the implementation choices of step 4):
#   jadero_prod      172.30.1.0/24   production services
#   jadero_staging   172.30.2.0/24   staging services
#   jadero_ops       172.30.3.0/24   Umami and its database
#
# The first line that matches type, database, user and address decides; a connection that no
# line matches is rejected too, and the reject lines at the end only say it out loud.

# TYPE  DATABASE          USER                   ADDRESS          METHOD

# The superuser, inside the container only, over the Unix socket. peer, not scram: the server
# checks the operating system user of the connecting process, so only a process running as the
# container's `postgres` user (`docker exec -u postgres ...`: provisioning, pg_dump for backups,
# the image's own init) gets in, and no superuser password exists to store, render or leak.
# The socket is not shared outside the container. No other role may use the socket.
local   all               postgres                                peer
local   all               all                                     reject

# Production, from jadero_prod only.
host    content_prod      content_prod           172.30.1.0/24    scram-sha-256
host    content_prod      content_reader_prod    172.30.1.0/24    scram-sha-256
host    agent_prod        agent_prod             172.30.1.0/24    scram-sha-256
host    contact_prod      contact_prod           172.30.1.0/24    scram-sha-256

# Staging, from jadero_staging only.
host    content_staging   content_staging        172.30.2.0/24    scram-sha-256
host    content_staging   content_reader_staging 172.30.2.0/24    scram-sha-256
host    agent_staging     agent_staging          172.30.2.0/24    scram-sha-256
host    contact_staging   contact_staging        172.30.2.0/24    scram-sha-256

# Umami, from jadero_ops only.
host    umami             umami                  172.30.3.0/24    scram-sha-256

# Everything else: any database, any role, any address, IPv4 and IPv6, replication included.
host    all               all                    0.0.0.0/0        reject
host    all               all                    ::/0             reject
host    replication       all                    0.0.0.0/0        reject
host    replication       all                    ::/0             reject
