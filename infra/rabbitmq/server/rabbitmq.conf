# Staging and production broker (one broker, vhosts /prod and /staging; WP-8 D4, ADR-029).
# The topology comes from definitions/, generated from packages/messaging/src/topology: never edit
# it by hand. RabbitMQ imports every file of the directory, whatever its extension, so it holds only
# the vhost files. They hold no users, so RabbitMQ never seeds `guest` or the `/` vhost; users and
# permissions are converged by infra/rabbitmq/provision-users.sh. The import is additive: a restart
# re-applies the files and keeps the users the script created.
load_definitions = /etc/rabbitmq/definitions
